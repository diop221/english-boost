<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_s06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow_s06" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_s06)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#059669" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#10b981" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#10b981" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
        <!-- Handshake / Agreement Checkmark & Dual Bubbles -->
        <circle cx="140" cy="85" r="42" fill="#10b981" fill-opacity="0.15"/>
        <path d="M115 85 L132 102 L168 66" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M85 70 C85 55 105 45 125 52 C135 45 155 45 165 55" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
        <circle cx="95" cy="115" r="14" fill="#34d399" fill-opacity="0.3"/>
        <path d="M91 115 L94 118 L101 111" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <circle cx="185" cy="115" r="14" fill="#34d399" fill-opacity="0.3"/>
        <path d="M181 115 L184 118 L191 111" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_s06)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">
      🤝 Accord & Alignement
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#10b981" filter="url(#shadow_s06)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 2
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_s06)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#059669" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « That makes sense. »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669">
      ➔ Ça a du sens. / Je comprends.
    </text>
  </g>
</svg>