<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_s103" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <filter id="shadow_s103" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_s103)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#0d9488" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#14b8a6" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#14b8a6" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
        <!-- Smiling connection / Friendly Waving -->
        <circle cx="140" cy="85" r="44" fill="#14b8a6" fill-opacity="0.15"/>
        <circle cx="140" cy="85" r="32" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
        <circle cx="128" cy="78" r="4" fill="#0d9488"/>
        <circle cx="152" cy="78" r="4" fill="#0d9488"/>
        <path d="M126 92 Q140 104 154 92" stroke="#0d9488" stroke-width="3" stroke-linecap="round" fill="none"/>
        <!-- Étoiles chaleureuses -->
        <circle cx="180" cy="60" r="5" fill="#2dd4bf"/>
        <circle cx="100" cy="60" r="4" fill="#2dd4bf"/>
      

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_s103)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0d9488">
      ✨ Politesse & Clôture
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#14b8a6" filter="url(#shadow_s103)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 7
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_s103)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#0d9488" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « Hopefully we can chat again… »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0d9488">
      ➔ J'espère qu'on pourra discuter …
    </text>
  </g>
</svg>