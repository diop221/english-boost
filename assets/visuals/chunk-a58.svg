<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_a58" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow_a58" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_a58)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#334155" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#475569" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#475569" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
        <!-- Key & Bullseye Target -->
        <circle cx="140" cy="85" r="44" fill="#475569" fill-opacity="0.12"/>
        <circle cx="140" cy="85" r="32" stroke="#334155" stroke-width="2.5" fill="none" stroke-dasharray="4,4"/>
        <circle cx="140" cy="85" r="18" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
        <circle cx="140" cy="85" r="6" fill="#059669"/>
        <!-- Golden Key -->
        <path d="M100 110 L125 85" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
        <circle cx="95" cy="115" r="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
        <line x1="118" y1="92" x2="124" y2="98" stroke="#f59e0b" stroke-width="3"/>
      

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_a58)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155">
      🔑 Raison & Cause (PREP: R)
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#475569" filter="url(#shadow_a58)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 11
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_a58)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « It's primarily due to... »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">
      ➔ C'est principalement dû à...
    </text>
  </g>
</svg>