<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_s09" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow_s09" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_s09)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#16a34a" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#22c55e" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
      <!-- Speech Arrow & Bullseye Target -->
      <circle cx="140" cy="85" r="44" fill="#22c55e" fill-opacity="0.15"/>
      <path d="M110 65 L160 65 C168 65 174 71 174 79 L174 89 C174 97 168 103 160 103 L135 103 L120 115 L120 103 L110 103 C102 103 96 97 96 89 L96 79 C96 71 102 65 110 65 Z" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
      <circle cx="135" cy="84" r="8" fill="#16a34a"/>
      <circle cx="135" cy="84" r="3" fill="#ffffff"/>
    

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_s09)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#16a34a">
      🎯 Structure & Expression
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#22c55e" filter="url(#shadow_s09)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 2
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_s09)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#16a34a" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « That's a good point. »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#16a34a">
      ➔ C'est un bon argument.
    </text>
  </g>
</svg>