<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_s79" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow_s79" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_s79)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#ca8a04" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#eab308" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#eab308" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
        <!-- Hourglass & Lightbulb Thought -->
        <circle cx="140" cy="85" r="42" fill="#eab308" fill-opacity="0.18"/>
        <!-- Ampoule moderne -->
        <path d="M125 75 C125 62 132 55 140 55 C148 55 155 62 155 75 C155 83 148 88 148 93 L132 93 C132 88 125 83 125 75 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2.5"/>
        <rect x="133" y="95" width="14" height="4" rx="2" fill="#a16207"/>
        <rect x="135" y="101" width="10" height="3" rx="1.5" fill="#a16207"/>
        <!-- Rayons d'inspiration -->
        <line x1="140" y1="42" x2="140" y2="48" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
        <line x1="115" y1="52" x2="120" y2="57" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
        <line x1="165" y1="52" x2="160" y2="57" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
        <!-- Bulles de pensée -->
        <circle cx="98" cy="98" r="6" fill="#eab308" opacity="0.7"/>
        <circle cx="86" cy="108" r="4" fill="#eab308" opacity="0.5"/>
      

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_s79)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ca8a04">
      💡 Pause & Réflexion
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#eab308" filter="url(#shadow_s79)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 5
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_s79)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#ca8a04" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « The funny thing is... »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ca8a04">
      ➔ Ce qui est drôle, c'est...
    </text>
  </g>
</svg>