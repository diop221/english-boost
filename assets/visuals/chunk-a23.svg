<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <linearGradient id="bgGrad_a23" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow_a23" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Arrière-plan stylé -->
  <rect width="280" height="210" rx="16" fill="url(#bgGrad_a23)"/>
  <rect x="1" y="1" width="278" height="208" rx="15" fill="none" stroke="#ea580c" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Trame de fond subtile -->
  <circle cx="240" cy="30" r="60" fill="#f97316" fill-opacity="0.08"/>
  <circle cx="30" cy="180" r="50" fill="#f97316" fill-opacity="0.06"/>

  <!-- Illustration vectorielle sémantique dédiée -->
  
        <!-- Lightning Spark & Surprise Badge -->
        <circle cx="140" cy="85" r="44" fill="#f97316" fill-opacity="0.15"/>
        <polygon points="145,45 125,85 142,85 135,125 160,80 143,80" fill="#ea580c" stroke="#c2410c" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="90" cy="65" r="5" fill="#f97316"/>
        <circle cx="190" cy="65" r="5" fill="#f97316"/>
        <path d="M85 95 Q90 85 100 88" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M195 95 Q190 85 180 88" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none"/>
      

  <!-- Badge Catégorie / Métaphore en haut à gauche -->
  <g transform="translate(14, 14)">
    <rect width="130" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" filter="url(#shadow_a23)"/>
    <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ea580c">
      ⚡ Surprise & Réaction
    </text>
  </g>

  <!-- Pastille Jour en haut à droite -->
  <g transform="translate(210, 14)">
    <rect width="56" height="24" rx="12" fill="#f97316" filter="url(#shadow_a23)"/>
    <text x="28" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Jour 8
    </text>
  </g>

  <!-- Bannière inférieure contextuelle avec traduction naturelle -->
  <g transform="translate(12, 146)">
    <rect width="256" height="52" rx="12" fill="#ffffff" fill-opacity="0.96" filter="url(#shadow_a23)"/>
    <rect x="0" y="0" width="256" height="52" rx="12" fill="none" stroke="#ea580c" stroke-opacity="0.25" stroke-width="1"/>
    <!-- Texte d'expression tronqué proprement -->
    <text x="14" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      « I honestly believe that... »
    </text>
    <!-- Traduction en français -->
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ea580c">
      ➔ Je crois sincèrement que...
    </text>
  </g>
</svg>